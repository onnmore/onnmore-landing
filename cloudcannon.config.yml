paths:
  static: ''
  uploads: uploads
timezone: Asia/Calcutta
markdown:
  engine: commonmark
  options: {}
collections_config:
  pages:
    path: ''
    icon: wysiwyg
    filter:
      exclude:
        - assets/**
        - images/**
        - icons/**
        - scripts/**
        - tools/**
        - news/**
        - blog/**
        - plan-checkout.html
        - plan-review.html
        - payment-result.html
        - upi-payment.html
        - admin.html
        - ADMIN_SETUP.md
        - apps-script/**
        - portal.html
        - service-request.html
        - printing-service.html
  blog:
    path: blog
    icon: event_available
  news:
    path: news
    icon: newsmode
    filter:
      exclude:
        - news.js
        - news.css
        - news.json
  tools:
    path: tools
    icon: looks
